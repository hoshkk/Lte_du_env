name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        # ubuntu-latest runners ship with an Android SDK + cmdline-tools already at
        # $ANDROID_HOME; we just need to accept licenses and make sure the platform/
        # build-tools versions this project targets are installed. (android-actions/
        # setup-android@v3 tries to install the long-removed legacy "tools" package
        # and fails, so we drive sdkmanager directly instead.)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-check-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
