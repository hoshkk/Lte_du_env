name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        # ubuntu-latest runners ship with an Android SDK + cmdline-tools already at
        # $ANDROID_HOME; we just need to accept licenses and make sure the platform/
        # build-tools versions this project targets are installed. (android-actions/
        # setup-android@v3 tries to install the long-removed legacy "tools" package
        # and fails, so we drive sdkmanager directly instead.)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-check-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a stable "latest" Release
        # Actions artifacts are a zip-of-a-zip served through a redirect that is
        # flaky to download from mobile browsers and expires after a few months.
        # A GitHub Release asset is a single stable, non-expiring, directly
        # downloadable file - same link every build, just updated in place.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          body: |
            Auto-published debug APK from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
            This release is overwritten on every push - it always points at the most recent build.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
